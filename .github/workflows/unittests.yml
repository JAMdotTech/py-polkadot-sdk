name: Run unit tests

on:
  workflow_call:
  push:
    branches: [master, develop, v1.0, v0.13]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master, develop, v1.0, v0.13]
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        if [ "${{ matrix.python-version }}" = "3.15" ]; then
          # Some native dependencies still build with PyO3 releases that predate Python 3.15.
          export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
        fi
        python -m pip install '.[test]' flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 substrateinterface test examples setup.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 substrateinterface test examples setup.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: python -m pytest
